# ==========================================================================
# 「成都 → 广州 09-27」监控配置（独立页面，数据源：携程 + 去哪儿）
#
# 监控 2 个班次（2026-09-27 成都双流 → 广州白云）：
#   CZ3444  南航  15:00 → 17:30   ¥770
#   3U8729  川航  15:05 → 17:30   ¥860
#
# 说明：
#   * 抓取由主配置 config.yaml 里同航向的路由完成（一次抓取服务所有页面），
#     本文件只负责"渲染 + 发布"，因此 publish.enabled 保持 false。
#   * 时间窗留空：按航班号精确匹配。
#   * 数据源按你的要求同时取携程与去哪儿。携程有 Whale Guard 风控，
#     需要先过一次人机验证（见 solve_ctrip.py），过完会话会保存在
#     user_data/ctrip 里，之后自动复用。
# ==========================================================================

routes:
  - from: CTU
    from_name: 成都
    to: CAN
    to_name: 广州
    dates:
      - "2026-09-27"
    watch_flights:
      - CZ3444
      - 3U8729
    depart_time_from: ""
    depart_time_to: ""
    # 这两班现价 ¥770/¥860，低于 700 才算真便宜
    alert_threshold: 700

platforms:
  - qunar
  - ctrip

schedule:
  # 只监控这一个航向，一轮只有 1 次去哪儿请求 + 1 次携程请求，约 1~2 分钟跑完。
  # 用户只需要监控到 2026-09-25（航班 09-27），所以这段时间把频率开到最大：
  # 10 分钟一轮 = 每天 144 轮，价格一变最多 10 分钟就能发现。
  # 瓶颈不是请求频率而是"缓存令牌别放太久"：令牌 30–90 分钟成功率最高，
  # 配合下面 crawler.token_max_age_minutes=90，大约每 9 轮才需要一次浏览器握手。
  interval_minutes: 10
  jitter_minutes: 2
  run_on_start: true
  # 现在只有一个航向，这个"航向间隔"不再起作用（保留以便将来加航线时复用）
  route_delay_seconds: 0
  # 平台各自的最小抓取间隔（分钟）。携程整轮要开一次浏览器（~40 秒）且经常被
  # Whale Guard 挡（返回 whaleguard block），逐航班价格又与去哪儿完全一致，
  # 所以每 30 分钟交叉验证一次就够；去哪儿每轮都跑（httpx 命中时只要几秒）。
  platform_skip_minutes:
    ctrip: 30

crawler:
  headless: true
  timeout_seconds: 45
  response_wait_seconds: 60
  delay_min: 5
  delay_max: 15
  # 去哪儿 Bella 令牌超过 90 分钟成功率骤降（>1.5h 约 20%），所以到点就重新握手。
  # 提到 90（原 60）是为了配合 10 分钟一轮：把浏览器握手从 144 次/天降到约 16 次/天。
  token_max_age_minutes: 90
  # 偶发登录墙（页面被跳到 user.qunar.com/mobile/login.jsp）后的冷却时间。
  # 撞墙期间不再跑浏览器握手，避免高频撞墙把风控喂得更狠；httpx 仍照常尝试
  # （含"用陈旧令牌硬试一次"的兜底）。实测登录墙恢复很快（有一次 3 分钟内就好了），
  # 所以冷却不宜太长，15 分钟即最多漏掉一轮多一点。
  wall_cooldown_minutes: 15
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  mobile_user_agent: ""
  debug: true
  debug_dir: debug
  user_data_dir: user_data

output:
  db_path: data/prices.db           # 与其它页面共用同一个价格库
  log_path: logs/monitor.log
  report_html: report-ctucan.html
  report_refresh_seconds: 300
  deploy_dir: deploy-ctucan

publish:
  # 这份配置现在是**主配置**：定时任务直接跑它（抓取 + 告警 + 发布一条龙），
  # 因此开启自动发布到 ctu-can-monitor.pages.dev。
  enabled: true
  provider: cloudflare-pages
  project: ctu-can-monitor
  # Cloudflare Pages 免费版限 500 次部署/月（本项目 09-17 才建，本月用量个位数）。
  # 用户只需监控到 2026-09-25，剩下约 8.5 天，因此把配额用满但不越界：
  # 价格没变时最短间隔 30 分钟、每天最多 45 次 -> 约 383 次，留出约 100 次余量。
  # 价格真正变动时这两个限制都不拦，会立刻发布。
  # 刷新最快的那一路是 GitHub Pages：每轮推送数据库都会重建，没有额度限制，
  # 所以 10 分钟一轮时它是页面上最新的那个链接。
  min_interval_minutes: 30
  max_per_day: 45

notifier:
  push_drop_min: 30
  push_rise_min: 50
  serverchan:
    enabled: false
    send_key: ""
    channel: ""
