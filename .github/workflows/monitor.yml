name: CZ3417 Flight Price Monitor

# 定时抓取已停用（保留手动触发做实验）
#
# 原因（实测，非猜测）：GitHub Actions 的机房 IP 访问去哪儿时，页面会被跳转到登录页
#   [qunar] 90 秒内未拦到 touchInnerList 响应
#   （当前页 https://user.qunar.com/mobile/login.jsp?ret=...）
# 即 Bella 指纹握手能过，但航班列表接口因登录墙不返回 → 云端抓不到数据。
#
# 现在的分工：
#   本机计划任务（见 install_task.ps1）负责抓取 → 推送 data/prices.db
#   → 触发 publish.yml 渲染并发布到 GitHub Pages（电脑关机后页面仍可访问）
#
# 想再试云端抓取：用 Actions 页面或 `gh workflow run monitor.yml` 手动触发；
# 闸门会保证抓不到数据时明确报红、且不覆盖线上好数据。
on:
  # schedule:
  #   - cron: "17 1,5,9,13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "监控日期 YYYY-MM-DD（留空用 config.ci.yaml 里的值）"
        required: false
        default: ""
      flights:
        description: "监控航班号，逗号分隔（留空用 config.ci.yaml 里的值）"
        required: false
        default: ""

permissions:
  contents: write      # 把价格历史 DB 提交回仓库（runner 是临时的，不提交就没有走势）
  pages: write
  id-token: write

concurrency:
  group: cz3417-monitor
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      # runner 默认 UTC。本机写库用的是北京时间，两边时区不一致会让
      # "取最近一轮" 的字符串比较选错批次，所以统一成 Asia/Shanghai。
      TZ: Asia/Shanghai
      MONITOR_DATE: ${{ github.event.inputs.date }}
      MONITOR_FLIGHTS: ${{ github.event.inputs.flights }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Unit tests (parser / alerter regression)
        run: python tests/test_flights.py

      - name: Scrape one round
        run: python main.py --once --headless -c config.ci.yaml --no-report

      # 闸门：抓不到新数据就红，绝不复用旧快照冒充本轮结果
      - name: Verify fresh data (fail loudly instead of republishing stale data)
        run: python scripts/ci_gate.py -c config.ci.yaml --minutes 20 --summary-out "$GITHUB_STEP_SUMMARY"

      - name: Build report + static bundle
        run: python report.py -c config.ci.yaml --deploy-dir deploy

      - name: Show result summary
        run: python scripts/ci_summary.py --deploy-dir deploy --summary-out "$GITHUB_STEP_SUMMARY"

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: |
            debug/
            logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist price history (runner is ephemeral)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add -f data/prices.db
          if git diff --cached --quiet; then
            echo "数据库无变化"
          else
            git commit -m "data: CZ3417 price snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      # 可选：如果仓库里配了 CLOUDFLARE_API_TOKEN secret，就同时发布到 Cloudflare Pages，
      # 让两个链接指向同一份最新数据。没配就自动跳过。
      - name: Publish to Cloudflare Pages (optional)
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler pages project create cz3417-monitor --production-branch main || true
          npx --yes wrangler pages deploy deploy --project-name cz3417-monitor --branch main --commit-dirty=true

  deploy-pages:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
