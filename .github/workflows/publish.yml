name: Publish report to GitHub Pages

# 只负责"渲染 + 发布"，不抓取。
#
# 为什么拆开：实测 GitHub Actions 的机房 IP 访问去哪儿会被跳转到登录页
# （日志：当前页 https://user.qunar.com/mobile/login.jsp），云端抓不到数据。
# 因此抓取放在本机计划任务里做（本机浏览器会话能过风控），
# 抓完把 data/prices.db 推上来，由本工作流渲染报告并发布到 Pages。
#
# 触发：data/prices.db 有更新时自动跑；也可手动 workflow_dispatch。
on:
  push:
    branches: [main]
    paths:
      - "data/prices.db"
      # 渲染逻辑或配置一变也应重新发布，否则站点会停留在旧模板
      - "report.py"
      - "core/flights.py"
      - "config.ci.yaml"
      - "config.w5.yaml"
      - "scripts/ci_summary.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # report.py 只需要 PyYAML（不碰 playwright / httpx），所以这一步很快
      - name: Install report dependencies
        run: python -m pip install --quiet PyYAML

      # 只发布成都→广州这一页（CZ3444 / 3U8729）。
      # 同时构建到根路径与 /ctucan/：根路径是站点默认入口，/ctucan/ 保留此前分享过的旧链接。
      - name: Build Chengdu-Guangzhou page (root)
        run: python report.py -c config.ctucan.yaml --deploy-dir deploy

      - name: Build the same page at /ctucan/ (keep the old link alive)
        run: python report.py -c config.ctucan.yaml --deploy-dir deploy/ctucan

      - name: Summary
        run: python scripts/ci_summary.py --deploy-dir deploy --summary-out "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
